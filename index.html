<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
.wha{font-family:'Barlow',sans-serif;color:#d0c8ba;width:100%}

/* HEADER */
.wha-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 20px 10px;background:#0d1f30;border-bottom:1px solid rgba(255,255,255,0.07);gap:12px;flex-wrap:wrap}
.wha-t1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(18px,4vw,28px);font-weight:900;letter-spacing:clamp(1px,0.5vw,3px);color:#fff;line-height:1}
.wha-t2{font-size:clamp(9px,1.8vw,10.5px);color:rgba(200,220,240,0.32);margin-top:4px;font-weight:300;line-height:1.5}
.wha-bdg{display:flex;gap:4px;flex-shrink:0;align-items:flex-start;flex-wrap:wrap}
.wha-b{border:1px solid #2a8080;color:#4fd4ce;padding:2px 6px;font-family:'Barlow Condensed',sans-serif;font-size:clamp(7px,1.5vw,8px);font-weight:700;letter-spacing:1px;white-space:nowrap}

/* HINT BAR */
.hint-bar{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:clamp(7.5px,1.8vw,8.5px);letter-spacing:0.8px;color:rgba(255,255,255,0.2);padding:3px 8px;background:#0d1f30;border-bottom:1px solid rgba(255,255,255,0.04);line-height:1.4}

/* MAP */
.wha-mwrap{position:relative;overflow:hidden;background:#1a4060;touch-action:none}
#wha-svg{display:block;width:100%;user-select:none;-webkit-user-select:none}
#wha-load{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;color:#4fd4ce;pointer-events:none}
@keyframes rf{to{stroke-dashoffset:-22}}
.wh-rt{fill:none;stroke-linecap:round;stroke-dasharray:7 13;animation:rf 3.2s linear infinite;cursor:crosshair}
.wh-gl{fill:none;stroke-linecap:round;pointer-events:none}

/* ZOOM BUTTONS */
.zoom-controls{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:3px}
.zoom-btn{width:clamp(30px,7vw,34px);height:clamp(30px,7vw,34px);background:rgba(8,20,35,0.88);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.7);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:300;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.zoom-btn:hover,.zoom-btn:active{background:rgba(30,85,80,0.9);border-color:#4fd4ce;color:#4fd4ce}
.zoom-level{width:clamp(30px,7vw,34px);height:16px;background:rgba(8,20,35,0.75);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.3);font-size:7px;letter-spacing:0.3px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;pointer-events:none}

/* LEGEND */
.wha-leg{position:absolute;bottom:8px;left:8px;background:rgba(8,20,35,0.88);border:1px solid rgba(255,255,255,0.07);padding:6px 8px}
.wha-lt{font-family:'Barlow Condensed',sans-serif;font-size:7px;font-weight:700;letter-spacing:2px;color:#4a6070;margin-bottom:4px}
.wha-lr{display:flex;align-items:center;gap:5px;margin-bottom:2.5px;font-size:7px;color:#4a6070;font-family:'Barlow Condensed',sans-serif}

/* TOOLTIP */
#wha-tip{position:absolute;background:rgba(5,14,26,0.96);border:1px solid rgba(255,255,255,0.1);padding:6px 9px;font-size:9px;pointer-events:none;z-index:50;max-width:170px;display:none;font-family:'Barlow',sans-serif;line-height:1.45;color:#948c7e}

/* CONTROLS */
.wha-ctrl{padding:7px 12px;background:#0d1f30;border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:5px}
.wha-cr{display:flex;align-items:flex-start;gap:6px}
.wha-cl{font-family:'Barlow Condensed',sans-serif;font-size:7.5px;font-weight:700;letter-spacing:1.5px;color:#4a6070;width:72px;flex-shrink:0;padding-top:4px}
.wha-bs{display:flex;gap:2px;flex-wrap:wrap}
.wha-mb{background:transparent;border:1px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.3);padding:3px 6px;font-family:'Barlow Condensed',sans-serif;font-size:clamp(8px,2vw,8.5px);font-weight:600;letter-spacing:0.5px;cursor:pointer;transition:all 0.15s;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:26px;display:flex;align-items:center}
.wha-mb:hover,.wha-mb:active{border-color:rgba(255,255,255,0.22);color:rgba(255,255,255,0.6)}
.wha-mb.a{background:#1a5555;border-color:#4fd4ce;color:#4fd4ce}
.wha-sb{border:1.5px solid;padding:3px 7px;font-family:'Barlow Condensed',sans-serif;font-size:clamp(7.5px,1.8vw,8.5px);font-weight:700;letter-spacing:0.4px;cursor:pointer;transition:opacity 0.2s;background:transparent;color:white;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:26px;display:flex;align-items:center}
.wha-sb.mx{opacity:0.15}

.wha-cards{display:flex;overflow-x:auto;background:#0a1825;border-top:1px solid rgba(255,255,255,0.05);scrollbar-width:thin;scrollbar-color:rgba(79,212,206,0.12) transparent;-webkit-overflow-scrolling:touch}
.wha-card{flex:0 0 clamp(140px,38vw,165px);padding:9px 11px;border-right:1px solid rgba(255,255,255,0.05);transition:background 0.2s}
.wha-card:hover{background:rgba(255,255,255,0.015)}
.wha-ct{display:flex;gap:7px;margin-bottom:6px;align-items:flex-start}
.wha-cb{width:3px;border-radius:2px;flex-shrink:0;height:30px;margin-top:1px}
.wha-cn{font-family:'Barlow Condensed',sans-serif;font-size:clamp(10px,2.5vw,11.5px);font-weight:700;letter-spacing:0.3px;color:#ddd3c3;line-height:1.2}
.wha-cs{font-style:italic;font-size:clamp(7px,1.8vw,8px);color:#3a5065;margin-top:2px;line-height:1.2}

function buildControls(){
  const md=document.getElementById('wha-ms');
  const ab=document.createElement('button');
  ab.className='wha-mb a'; ab.textContent='TUTTI';
  ab.onclick=()=>{selM=null;document.querySelectorAll('.wha-mb').forEach(b=>b.classList.remove('a'));ab.classList.add('a');upd()};
  md.appendChild(ab);
  MN.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='wha-mb'; b.textContent=m.toUpperCase();
    b.onclick=()=>{selM=i+1;document.querySelectorAll('.wha-mb').forEach(x=>x.classList.remove('a'));b.classList.add('a');upd()};
    md.appendChild(b);
  });
  const sd=document.getElementById('wha-ss');
  SP.forEach(s=>{
    const b=document.createElement('button');
    b.className='wha-sb'; b.dataset.id=s.id;
    const short=s.name.replace(' Whales','').replace(' Whale','').replace('N. Atlantic Right','N.A. Right').toUpperCase();
    b.textContent=short;
    b.style.borderColor=s.col; b.style.color=s.col;
    b.onclick=()=>{if(selSp.has(s.id)){selSp.delete(s.id);b.classList.add('mx')}else{selSp.add(s.id);b.classList.remove('mx')}upd()};
    sd.appendChild(b);
  });
}

function buildCards(){
  const c=document.getElementById('wha-cards');
  const iucnL={LC:'Least Concern',VU:'Vulnerable',EN:'Endangered',CR:'Critically Endangered'};
  const iucnC={LC:'lc',VU:'vu',EN:'en',CR:'cr'};
  SP.forEach(s=>{
    c.innerHTML+=`<div class="wha-card">
      <div class="wha-ct"><div class="wha-cb" style="background:${s.col}"></div>
      <div><div class="wha-cn">${s.name}</div><div class="wha-cs">${s.sci}</div></div></div>
      <div class="wha-st">
        <div class="wha-sr"><span class="wha-sk">Lunghezza</span><span class="wha-sv">${s.len}</span></div>
        <div class="wha-sr"><span class="wha-sk">Peso</span><span class="wha-sv">${s.wt}</span></div>
        <div class="wha-sr"><span class="wha-sk">Popolazione</span><span class="wha-sv">${s.pop}</span></div>
        <div class="wha-sr"><span class="wha-sk">Migrazione</span><span class="wha-sv">${s.dist}</span></div>
      </div>
      <div class="wha-iu iu-${iucnC[s.iucn]}">${s.iucn} — ${iucnL[s.iucn]}</div>
    </div>`;
  });
}

function upd(){
  ['wh-rt','wh-gl','wh-area','wh-lbl'].forEach(cls=>{
    document.querySelectorAll('.'+cls).forEach(el=>{
      const sid=el.getAttribute('data-sp');
      const ms=JSON.parse(el.getAttribute('data-m')||'[]');
      const ok=selSp.has(sid)&&(selM===null||ms.includes(selM));
      el.style.transition='opacity 0.3s'; el.style.opacity=ok?'1':'0';
    });
  });
}

async function renderMap(){
  let world;
  try{ world=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()); }
  catch(e){ document.getElementById('wha-load').textContent='Errore caricamento. Riprova.'; return; }
  document.getElementById('wha-load').style.display='none';

  const wrap=document.querySelector('.wha-mwrap');
  const W=wrap.clientWidth||380;
  // Taller ratio on mobile for better visibility
  const isMobile=W<600;
  const H=Math.round(W*(isMobile?0.70:0.51));

  svgSel=d3.select('#wha-svg')
    .attr('viewBox',`0 0 ${W} ${H}`)
    .attr('preserveAspectRatio','xMidYMid meet')
    .attr('width',W).attr('height',H);

  const proj=d3.geoNaturalEarth1().scale(W/6.3).translate([W/2,H/2]);
  const path=d3.geoPath().projection(proj);
  const grat=d3.geoGraticule().step([20,20]);

  const defs=svgSel.append('defs');
  const og=defs.append('radialGradient').attr('id','og3').attr('cx','50%').attr('cy','48%').attr('r','55%');
  og.append('stop').attr('offset','0%').attr('stop-color','#2a6a9a');
  og.append('stop').attr('offset','55%').attr('stop-color','#1a4e7a');
  og.append('stop').attr('offset','100%').attr('stop-color','#0e2e50');

  svgSel.append('rect').attr('width',W).attr('height',H).attr('fill','url(#og3)');
  const g=svgSel.append('g').attr('id','zoom-g');
  g.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','url(#og3)');
  g.append('path').datum(grat()).attr('d',path).attr('fill','none').attr('stroke','rgba(255,255,255,0.07)').attr('stroke-width',0.4);

  const ctrs=topojson.feature(world,world.objects.countries);
  g.append('g').selectAll('path').data(ctrs.features).enter().append('path')
    .attr('d',path).attr('fill',d=>ICE.has(+d.id)?'#ddeef5':'#8aaa72')
    .attr('stroke','#5a7a48').attr('stroke-width',0.35);
  g.append('path').datum(topojson.mesh(world,world.objects.countries,(a,b)=>a!==b))
    .attr('d',path).attr('fill','none').attr('stroke','rgba(60,90,40,0.5)').attr('stroke-width',0.25);
  g.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','none')
    .attr('stroke','rgba(100,180,220,0.35)').attr('stroke-width',1.2);

  // Ocean labels — hidden on small mobile, visible when zoomed
  const fs=Math.max(6,W/130);
  const oceans=[{t:'PACIFICO',lon:-150,lat:5},{t:'ATLANTICO',lon:-28,lat:5},{t:'INDIANO',lon:75,lat:-22},{t:'ARTICO',lon:0,lat:83},{t:'ANTARTICO',lon:10,lat:-58},{t:'PACIFICO',lon:165,lat:-30}];
  oceans.forEach(o=>{
    const pt=proj([o.lon,o.lat]); if(!pt)return;
    g.append('text').attr('x',pt[0]).attr('y',pt[1]).attr('text-anchor','middle')
      .attr('fill','rgba(220,240,255,0.16)').attr('font-size',fs+'px')
      .attr('font-family','Barlow Condensed,sans-serif').attr('font-weight','300').attr('letter-spacing','3').text(o.t);
  });

  // Whale areas
  SP.forEach(s=>{
    s.areas.forEach(a=>{
      const circ=d3.geoCircle().center([a.lon,a.lat]).radius(4.5)();
      g.append('path').datum(circ).attr('d',path)
        .attr('class',`wh-area wh-a-${s.id}`).attr('data-sp',s.id).attr('data-m',JSON.stringify(a.m))
        .attr('fill',s.col).attr('fill-opacity',0.14).attr('stroke',s.col)
        .attr('stroke-opacity',a.s==='b'?0.55:0.35).attr('stroke-width',1.2)
        .attr('stroke-dasharray',a.s==='b'?'4 3':'none');
    });
  });

  // Whale routes
  SP.forEach(s=>{
    s.routes.forEach((r,ri)=>{
      const feat={type:'Feature',geometry:{type:'LineString',coordinates:r.c}};
      g.append('path').datum(feat).attr('d',path)
        .attr('class',`wh-gl wh-g-${s.id}`).attr('data-sp',s.id).attr('data-m',JSON.stringify(r.m))
        .attr('stroke',s.col).attr('stroke-width',5).attr('stroke-opacity',0.12);
      g.append('path').datum(feat).attr('d',path)
        .attr('class',`wh-rt wh-r-${s.id}`).attr('data-sp',s.id).attr('data-m',JSON.stringify(r.m))
        .attr('stroke',s.col).attr('stroke-width',1.6).attr('stroke-opacity',0.9)
        .style('animation-delay',(ri*0.5)+'s')
        .on('mouseenter touchstart',function(ev){
          if(ev.type==='touchstart') ev.preventDefault();
          const [mx,my]=d3.pointer(ev,wrap);
          const tip=document.getElementById('wha-tip');
          tip.innerHTML=`<strong style="color:${s.col};font-family:'Barlow Condensed',sans-serif;font-size:10.5px">${s.name}</strong><span style="display:block;margin-bottom:1px">${r.n}</span><span style="color:#4a6070;font-size:8px">${MN.filter((_,i)=>r.m.includes(i+1)).join(', ')}</span>`;
          tip.style.display='block'; tip.style.left=Math.min(mx+10,W-180)+'px'; tip.style.top=Math.max(my-50,4)+'px';
          d3.select(this).attr('stroke-opacity',1).attr('stroke-width',2.8);
        })
        .on('mousemove',function(ev){
          const [mx,my]=d3.pointer(ev,wrap);
          const t=document.getElementById('wha-tip');
          t.style.left=Math.min(mx+10,W-180)+'px'; t.style.top=Math.max(my-50,4)+'px';
        })
        .on('mouseleave touchend',function(){
          setTimeout(()=>{ document.getElementById('wha-tip').style.display='none'; },isTouch?1200:0);
          d3.select(this).attr('stroke-opacity',0.9).attr('stroke-width',1.6);
        });
    });
  });

  // Labels
  const lfs=Math.max(5.5,W/165);
  SP.forEach(s=>{
    s.areas.forEach(a=>{
      const pt=proj([a.lon,a.lat]); if(!pt)return;
      const lines=a.l.split('\n');
      const gr=g.append('g').attr('class',`wh-lbl wh-l-${s.id}`).attr('data-sp',s.id).attr('data-m',JSON.stringify(a.m))
        .attr('transform',`translate(${pt[0]},${pt[1]})`);
      const lh=lfs*1.35, mxl=Math.max(...lines.map(x=>x.length));
      const rw=mxl*lfs*0.62+7, rh=lines.length*lh+4;
      gr.append('rect').attr('x',-rw/2).attr('y',-rh-lh*0.1).attr('width',rw).attr('height',rh)
        .attr('fill','rgba(5,15,28,0.82)').attr('rx',2);
      lines.forEach((line,i)=>{
        gr.append('text').attr('x',0).attr('y',-rh+lh*(i+0.82))
          .attr('text-anchor','middle').attr('fill',i===0?s.col:'rgba(200,220,240,0.55)')
          .attr('font-size',(i===0?lfs+0.5:lfs)+'px').attr('font-family','Barlow Condensed,sans-serif')
          .attr('font-weight',i===0?'700':'400').attr('letter-spacing','0.3').text(line);
      });
    });
  });

  // ===================== ZOOM =====================
  zoomBeh=d3.zoom().scaleExtent([1,14]).translateExtent([[0,0],[W,H]])
    .on('zoom',(event)=>{
      const t=event.transform, k=t.k;
      g.attr('transform',t);
      g.selectAll('.wh-rt').attr('stroke-width',1.6/Math.sqrt(k));
      g.selectAll('.wh-gl').attr('stroke-width',5/Math.sqrt(k));
      g.selectAll('.wh-area').attr('stroke-width',1.2/Math.sqrt(k));
      g.selectAll('.wh-lbl').each(function(){
        const el=d3.select(this);
        const ot=el.attr('data-orig')||(el.attr('data-orig',el.attr('transform')),el.attr('transform'));
        const m=ot.match(/translate\(([^,]+),([^)]+)\)/);
        if(m) el.attr('transform',`translate(${m[1]},${m[2]}) scale(${1/k})`);
      });
      document.getElementById('zlvl').textContent=k.toFixed(1)+'×';
    });

  // Double-click / double-tap zoom
  let lastTap=0;
  svgSel.on('dblclick',function(ev){
    ev.preventDefault();
    const [mx,my]=d3.pointer(ev);
    const cur=d3.zoomTransform(svgSel.node());
    const nk=Math.min(cur.k*2,14);
    svgSel.transition().duration(420).call(zoomBeh.transform,
      d3.zoomIdentity.translate(mx-nk*(mx-cur.x)/cur.k, my-nk*(my-cur.y)/cur.k).scale(nk));
  });
  svgSel.on('touchend',function(ev){
    const now=Date.now();
    if(now-lastTap<320){
      ev.preventDefault();
      const t=ev.changedTouches[0];
      const rect=svgSel.node().getBoundingClientRect();
      const mx=t.clientX-rect.left, my=t.clientY-rect.top;
      const cur=d3.zoomTransform(svgSel.node());
      const nk=Math.min(cur.k*2,14);
      svgSel.transition().duration(420).call(zoomBeh.transform,
        d3.zoomIdentity.translate(mx-nk*(mx-cur.x)/cur.k, my-nk*(my-cur.y)/cur.k).scale(nk));
    }
    lastTap=now;
  });
  svgSel.on('contextmenu',function(ev){
    ev.preventDefault();
    const [mx,my]=d3.pointer(ev);
    const cur=d3.zoomTransform(svgSel.node());
    const nk=Math.max(cur.k/2,1);
    svgSel.transition().duration(420).call(zoomBeh.transform,
      d3.zoomIdentity.translate(mx-nk*(mx-cur.x)/cur.k, my-nk*(my-cur.y)/cur.k).scale(nk));
  });

  svgSel.call(zoomBeh).on('dblclick.zoom',null);

  document.getElementById('zin').onclick=()=>svgSel.transition().duration(350).call(zoomBeh.scaleBy,1.8);
  document.getElementById('zout').onclick=()=>svgSel.transition().duration(350).call(zoomBeh.scaleBy,1/1.8);
  document.getElementById('zrst').onclick=()=>svgSel.transition().duration(600).call(zoomBeh.transform,d3.zoomIdentity);

  // Resize handler
  window.addEventListener('resize',()=>{
    const nW=wrap.clientWidth;
    if(Math.abs(nW-W)>20){ location.reload(); } // simple reload on significant resize
  });
}

buildControls(); buildCards(); renderMap();
</script>
